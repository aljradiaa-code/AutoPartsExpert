workflows:
  android-apk:
    name: Android APK (debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups: []
      vars:
        PACKAGE_NAME: "com.worldscan.autoparts"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Extract project archive
        script: |
          set -e
          ARCHIVE=$(ls *.zip | head -n1)
          if [ -z "$ARCHIVE" ]; then
            echo "No .zip file found next to codemagic.yaml in the repo root." >&2
            exit 1
          fi
          echo "Extracting $ARCHIVE ..."
          rm -rf _extract
          mkdir -p _extract
          unzip -q -o "$ARCHIVE" -d _extract

          if [ -f "_extract/build.gradle.kts" ]; then
            SRC="_extract"
          else
            FOUND=$(find _extract -name "build.gradle.kts" | head -n1)
            if [ -z "$FOUND" ]; then
              echo "Could not find build.gradle.kts inside $ARCHIVE — check the archive contents." >&2
              exit 1
            fi
            SRC=$(dirname "$FOUND")
          fi

          cp -R "$SRC"/. .
          rm -rf _extract
      - name: Set execute permission for gradlew
        script: chmod +x ./gradlew
      - name: Diagnose llamacpp-kotlin real API (temporary — will be removed once the AI chat feature compiles cleanly)
        script: |
          set +e
          echo "== Resolving dependencies only (no compile) to populate the Gradle cache =="
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath -q

          AAR=$(find ~/.gradle/caches -iname "llamacpp-kotlin-*.aar" 2>/dev/null | head -n1)
          echo "== Found AAR: $AAR =="
          if [ -n "$AAR" ]; then
            rm -rf /tmp/llama_inspect && mkdir -p /tmp/llama_inspect
            cd /tmp/llama_inspect
            unzip -q "$AAR"
            echo "== javap: org.nehuatl.llamacpp.LlamaHelper =="
            javap -p -classpath classes.jar org.nehuatl.llamacpp.LlamaHelper 2>&1
            echo "== javap: all classes in org.nehuatl.llamacpp package =="
            unzip -l classes.jar | grep "org/nehuatl/llamacpp/" | awk '{print $4}' | sed 's/\.class$//; s/\//./g' | while read -r cls; do
              echo "---- $cls ----"
              javap -p -classpath classes.jar "$cls" 2>&1
            done
            cd - > /dev/null
          else
            echo "AAR not found in Gradle cache — dependency resolution may have failed."
          fi
          set -e
      - name: Build debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
