workflows:
  android-apk:
    name: Android APK (debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups: []
      vars:
        PACKAGE_NAME: "com.worldscan.autoparts"
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Extract project archive
        script: |
          set -e
          ARCHIVE=$(ls *.zip | head -n1)
          if [ -z "$ARCHIVE" ]; then
            echo "No .zip file found next to codemagic.yaml in the repo root." >&2
            exit 1
          fi
          echo "Extracting $ARCHIVE ..."
          rm -rf _extract
          mkdir -p _extract
          unzip -q -o "$ARCHIVE" -d _extract

          # Handle both layouts: zip contents directly at top level, or
          # wrapped in one extra folder (e.g. Finder/Explorer "Compress" does this).
          if [ -f "_extract/build.gradle.kts" ]; then
            SRC="_extract"
          else
            FOUND=$(find _extract -name "build.gradle.kts" | head -n1)
            if [ -z "$FOUND" ]; then
              echo "Could not find build.gradle.kts inside $ARCHIVE — check the archive contents." >&2
              exit 1
            fi
            SRC=$(dirname "$FOUND")
          fi

          cp -R "$SRC"/. .
          rm -rf _extract
      - name: Set execute permission for gradlew
        script: chmod +x ./gradlew
      - name: Build debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
